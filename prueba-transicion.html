<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de transición de color por scroll</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }

  /* Layer de fondo fijo: ocupa toda la pantalla, detrás de todo el
     contenido, y es el ÚNICO elemento cuyo background-color se toca
     desde JS. Los bloques de contenido son transparentes: lo que se ve
     de fondo siempre es este layer. */
  #bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #000000;
  }

  .block {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: transparent;
  }

  .block h1 {
    font-size: 3rem;
    font-weight: 800;
  }

  .block p {
    margin-top: 12px;
    font-size: 1.1rem;
    opacity: 0.75;
  }

  .block-dark h1,
  .block-dark p {
    color: #FFFFFF;
  }

  .block-light h1,
  .block-light p {
    color: #0A0A0A;
  }

  /* Panel de debug: muestra scrollY y el color interpolado en vivo, para
     confirmar que cambia de forma continua y no queda pegado. */
  #debug-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: #FFCC00;
    color: #000000;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 8px;
    line-height: 1.5;
    pointer-events: none;
    border: 2px solid #000000;
  }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="debug-panel">
  scrollY: <span id="debugScrollY">0</span><br>
  bg: <span id="debugColor">rgb(0, 0, 0)</span><br>
  zona: <span id="debugZone">—</span>
</div>

<div class="block block-dark" data-bg="#000000">
  <div>
    <h1>Bloque 1</h1>
    <p>Fondo negro — scrolleá hacia abajo</p>
  </div>
</div>

<div class="block block-light" data-bg="#FFFFFF">
  <div>
    <h1>Bloque 2</h1>
    <p>Fondo blanco</p>
  </div>
</div>

<div class="block block-dark" data-bg="#000000">
  <div>
    <h1>Bloque 3</h1>
    <p>Fondo negro de nuevo</p>
  </div>
</div>

<div class="block block-light" data-bg="#FFFFFF">
  <div>
    <h1>Bloque 4</h1>
    <p>Fondo blanco, último bloque</p>
  </div>
</div>

<script>
/* ---------- Medir bloques reales del DOM (no hardcodeado) ---------- */
const ZONE_HEIGHT = 300; // px de scroll que dura cada transición
const HALF_ZONE = ZONE_HEIGHT / 2;

const bgLayer = document.getElementById('bg-layer');
const debugScrollY = document.getElementById('debugScrollY');
const debugColor = document.getElementById('debugColor');
const debugZone = document.getElementById('debugZone');

let blocks = [];
let boundaries = []; // posición Y (documento) del límite entre bloque i y i+1

function measure() {
  const els = [...document.querySelectorAll('.block')];
  blocks = els.map(el => ({
    el,
    color: el.dataset.bg,
    top: el.offsetTop,
    bottom: el.offsetTop + el.offsetHeight
  }));
  // El límite real entre bloque i e i+1 es donde termina el bloque i
  // (que, al no haber gaps entre bloques, coincide con donde empieza el
  // siguiente).
  boundaries = blocks.slice(0, -1).map(b => b.bottom);
}

function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function lerpColor(hexA, hexB, t) {
  const [r1, g1, b1] = hexToRgb(hexA);
  const [r2, g2, b2] = hexToRgb(hexB);
  const r = Math.round(lerp(r1, r2, t));
  const g = Math.round(lerp(g1, g2, t));
  const b = Math.round(lerp(b1, b2, t));
  return `rgb(${r}, ${g}, ${b})`;
}

function computeColor(scrollY) {
  // Antes del primer límite: color sólido del primer bloque.
  if (boundaries.length === 0 || scrollY < boundaries[0] - HALF_ZONE) {
    return { color: blocks[0].color, zone: 'sólido — bloque 1' };
  }

  for (let i = 0; i < boundaries.length; i++) {
    const boundary = boundaries[i];
    const zoneStart = boundary - HALF_ZONE;
    const zoneEnd = boundary + HALF_ZONE;

    if (scrollY < zoneStart) {
      // Ya pasamos el límite anterior y todavía no llegamos a este:
      // color sólido del bloque i.
      return { color: blocks[i].color, zone: `sólido — bloque ${i + 1}` };
    }

    if (scrollY >= zoneStart && scrollY <= zoneEnd) {
      const t = (scrollY - zoneStart) / ZONE_HEIGHT; // 0 a 1
      return {
        color: lerpColor(blocks[i].color, blocks[i + 1].color, t),
        zone: `transición ${i + 1}→${i + 2} (${Math.round(t * 100)}%)`
      };
    }
    // scrollY > zoneEnd: seguir revisando el próximo límite. Si es el
    // último, cae en el color sólido del último bloque más abajo.
  }

  const last = blocks[blocks.length - 1];
  return { color: last.color, zone: `sólido — bloque ${blocks.length}` };
}

function update() {
  const { color, zone } = computeColor(window.scrollY);
  bgLayer.style.backgroundColor = color;
  debugScrollY.textContent = Math.round(window.scrollY);
  debugColor.textContent = color;
  debugZone.textContent = zone;
}

let ticking = false;
function onScroll() {
  if (!ticking) {
    requestAnimationFrame(() => {
      update();
      ticking = false;
    });
    ticking = true;
  }
}

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => { measure(); update(); });

measure();
update();
</script>
</body>
</html>
